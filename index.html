<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom · Placement Study Planner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E28FA4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg:#FBF3F6; --bg2:#FDF8FA;
  --card:#FFFFFF; --card2:#FBF0F4;
  --border:#F1DEE6; --border2:#E5C8D4;
  --text:#46303C; --text2:#82656F; --text3:#B39AA5;
  --pink:#E28FA4; --pink2:#EDABC0; --pink-soft:#FBE8EF;
  --rose:#C25E7B; --rose2:#D2738E;
  --gold:#C29B4C; --gold-soft:#F9F0DC;
  --terra:#C97F6B; --terra-soft:#F9E9E3;
  --lv0:#F7ECF1; --lv1:#F4D6E0; --lv2:#E9AEC0; --lv3:#D67E99; --lv4:#AC4A6A;
  --toast-bg:#46303C; --toast-fg:#FBF3F6;
  --shadow:0 1px 2px rgba(90,48,66,.05),0 8px 24px rgba(90,48,66,.08);
  --shadow-lg:0 14px 44px rgba(90,48,66,.18);
}
[data-theme="dark"]{
  --bg:#221820; --bg2:#281D25;
  --card:#2F222B; --card2:#362932;
  --border:#44323E; --border2:#523C49;
  --text:#F4E9EE; --text2:#C9B2BC; --text3:#977F8B;
  --pink:#E8A3B6; --pink2:#DB8DA3; --pink-soft:#3D2A34;
  --rose:#E29BB2; --rose2:#ECB1C4;
  --gold:#D8B76E; --gold-soft:#3B3122;
  --terra:#D89C8D; --terra-soft:#412D27;
  --lv0:#332531; --lv1:#4E3040; --lv2:#6D4156; --lv3:#93566E; --lv4:#C27E96;
  --toast-bg:#F4E9EE; --toast-fg:#2A1B22;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3);
  --shadow-lg:0 14px 44px rgba(0,0,0,.45);
}
/* ============ base ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;font-size:15px;line-height:1.55;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',sans-serif;line-height:1.2;color:var(--text)}
.serif{font-family:'Fraunces',serif}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
.hidden{display:none!important}
::selection{background:var(--pink-soft);color:var(--rose)}
::-webkit-scrollbar{width:10px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:6px}
.ic{width:19px;height:19px;flex:none}
.ic.s{width:14px;height:14px}
/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14px;border:1px solid transparent;border-radius:12px;padding:10px 18px;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--rose);color:#FFF8FA}
[data-theme="dark"] .btn-primary{color:#2A1B22}
.btn-primary:hover{background:var(--rose2);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-ghost{border-color:var(--border2);background:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--card2);color:var(--text);border-color:var(--pink)}
.btn-soft{background:var(--pink-soft);color:var(--rose)}
[data-theme="dark"] .btn-soft{color:#F4E9EE}
.btn-soft:hover{filter:brightness(1.03)}
.btn-danger-solid{background:var(--terra);color:#FFF6F2}
.btn-danger-solid:hover{filter:brightness(1.05)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn-lg{padding:14px 26px;font-size:15px;border-radius:14px}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;color:var(--text3);transition:.15s}
.btn-icon:hover{background:var(--card2);color:var(--text)}
.btn-icon.danger:hover{background:var(--terra-soft);color:var(--terra)}
/* ============ cards & layout bits ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.card-soft{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:16px}
.lift{transition:transform .18s,box-shadow .18s}
.lift:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.eyebrow{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);margin-bottom:6px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:clamp(22px,3vw,28px);font-weight:800}
.page-sub{color:var(--text2);font-size:14px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.empty{text-align:center;padding:44px 24px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .empty-ic{width:48px;height:48px;border-radius:50%;background:var(--pink-soft);color:var(--rose);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.empty h3{font-size:18px}
.empty p{color:var(--text2);font-size:14px;max-width:380px}
.empty .btn{margin-top:10px}
.empty-line{color:var(--text3);font-size:13.5px;font-style:italic}
.list-note{font-size:12.5px;color:var(--text3);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--border);color:var(--text2)}
/* ============ shell ============ */
.app{min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;padding:22px 14px 18px;border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;gap:4px;z-index:50}
.logo{display:flex;align-items:center;gap:11px;padding:4px 10px 18px}
.logo-ic{width:38px;height:38px;border-radius:12px;background:var(--pink-soft);color:var(--rose);display:flex;align-items:center;justify-content:center}
.logo-name{font-family:'Plus Jakarta Sans';font-weight:800;font-size:18px;letter-spacing:-.01em}
.logo-tag{font-size:11px;color:var(--text3);font-weight:700}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--text2);font-weight:700;font-size:14px;text-align:left;width:100%;transition:.15s}
.nav-item:hover{background:var(--card2);color:var(--text)}
.nav-item:active{transform:scale(.97)}
.nav-item.active{background:var(--pink-soft);color:var(--rose)}
[data-theme="dark"] .nav-item.active{color:#F4E9EE}
.side-foot{display:flex;flex-direction:column;gap:10px;padding:0 6px}
.side-streak{text-align:center;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px}
.streak-num{font-family:'Plus Jakarta Sans';font-weight:800;font-size:22px}
.streak-lbl{font-size:11.5px;color:var(--text3);font-weight:700}
.side-tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);text-align:center;font-weight:700}
.side-foot-row{display:flex;justify-content:center}
.main{margin-left:250px;min-height:100vh}
.page{max-width:1080px;margin:0 auto;padding:30px 36px 60px;animation:fadeUp .3s ease both}
.topbar{display:none}
.bottomnav{display:none}
/* ============ segments ============ */
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--border);border-radius:13px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:9px;font-weight:700;font-size:13px;color:var(--text3);transition:.15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--card);color:var(--rose);box-shadow:var(--shadow)}
[data-theme="dark"] .seg button.on{color:#F4E9EE}
.filters{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
/* ============ dashboard ============ */
.dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.dash-head h1{font-size:clamp(23px,3.4vw,30px);font-weight:800}
.dash-dayline{color:var(--text2);font-size:14px;margin-top:4px}
.quote{font-family:'Fraunces',serif;font-style:italic;font-size:17px;color:var(--text2);border-left:3px solid var(--pink);padding:4px 0 4px 16px;margin:20px 0 24px;max-width:560px}
.dash-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:26px}
.dash-side{display:flex;flex-direction:column;gap:16px}
.mission{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:28px 24px}
.mission-head{display:flex;justify-content:space-between;width:100%;align-items:center}
.mission-stats{display:flex;width:100%;border-top:1px solid var(--border);padding-top:16px}
.mission-stats>div{flex:1;display:flex;flex-direction:column;gap:2px}
.mission-stats>div+div{border-left:1px solid var(--border)}
.mission-stats .ms-v{font-family:'Plus Jakarta Sans';font-weight:800;font-size:19px}
.mission-stats .ms-l{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.mission-cap{font-size:13.5px;color:var(--text2)}
.mission-done .big{font-family:'Plus Jakarta Sans';font-weight:800;font-size:24px;color:var(--gold)}
.mission-done p{color:var(--text2)}
.quick{display:flex;gap:10px;flex-wrap:wrap}
.quick .q{flex:1;min-width:100px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.quick .q b{display:block;font-family:'Plus Jakarta Sans';font-size:19px;font-weight:800}
.quick .q span{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title h3{font-size:16px;font-weight:800}
/* ============ rings ============ */
.ring-wrap{position:relative;display:inline-block}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring-track{stroke:var(--border)}
.ring-fill{stroke:var(--pink);transition:stroke-dashoffset .9s cubic-bezier(.22,.8,.28,1)}
.ring-fill.live{transition:stroke-dashoffset .35s linear}
.ring-fill.gold{stroke:var(--gold)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-pct{font-family:'Plus Jakarta Sans';font-weight:800;font-size:26px;line-height:1}
.ring-pct-sm{font-family:'Plus Jakarta Sans';font-weight:800;font-size:19px;line-height:1}
/* ============ tasks ============ */
.task-list{display:flex;flex-direction:column;gap:12px}
.task{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.task.dragging{opacity:.45;border-style:dashed}
.task.drop-target{border-color:var(--pink)}
.task-check{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;color:transparent;transition:.2s;margin-top:2px}
.task-check:hover{border-color:var(--pink)}
.task-check.on{background:var(--rose);border-color:var(--rose);color:#fff;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.task-check .ic{width:14px;height:14px}
.task-main{flex:1;min-width:0}
.task-title{font-weight:800;font-size:15px;font-family:'Plus Jakarta Sans'}
.task.done .task-title{color:var(--text3);text-decoration:line-through;text-decoration-color:var(--border2);font-weight:600}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--text2);margin-top:4px;align-items:center}
.task-meta .dot{opacity:.4}
.t-sub{font-weight:700}
.prio.high{color:var(--terra);font-weight:800}
.prio.medium{color:var(--gold);font-weight:800}
.prio.low{color:var(--text3);font-weight:700}
.overdue{color:var(--terra);font-weight:800}
.task-prog{display:flex;align-items:center;gap:10px;margin-top:8px}
.task-prog-bar{flex:1;max-width:180px;height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
.task-prog-bar i{display:block;height:100%;border-radius:3px;background:var(--pink);transition:width .6s ease}
.task-prog span{font-size:12px;color:var(--text2);font-weight:700;white-space:nowrap}
.task-desc{font-size:13px;color:var(--text2);margin-top:6px}
.task-done-note{font-size:12.5px;color:var(--rose);font-weight:700;margin-top:6px}
.task-actions{display:flex;align-items:center;gap:4px;flex:none}
.reorder{display:flex;flex-direction:column}
.reorder .btn-icon{width:26px;height:22px}
/* ============ focus ============ */
.focus-wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.focus-badge{letter-spacing:.22em;font-size:11.5px;font-weight:800;color:var(--rose);background:var(--pink-soft);padding:7px 16px;border-radius:999px}
[data-theme="dark"] .focus-badge{color:#F4E9EE}
.focus-badge.goldb{color:var(--gold);background:var(--gold-soft)}
.focus-task{font-size:clamp(20px,3vw,26px);font-weight:800}
.f-clock{font-family:'Plus Jakarta Sans';font-size:clamp(44px,9vw,60px);font-weight:800;letter-spacing:.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.f-sub{font-size:12.5px;color:var(--text3);font-weight:700;margin-top:2px}
.focus-line{color:var(--text2);font-size:14.5px}
.focus-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.focus-meta{font-size:13px;color:var(--text3);font-weight:700}
.f-taskbar-wrap{width:min(320px,80vw)}
.focus-setup{width:100%;text-align:left;display:flex;flex-direction:column;gap:4px}
.dur-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dur-chip{padding:9px 16px;border-radius:999px;border:1.5px solid var(--border2);font-weight:800;font-size:14px;color:var(--text2);transition:.15s}
.dur-chip:hover{border-color:var(--pink)}
.dur-chip.on{background:var(--pink-soft);border-color:var(--pink);color:var(--rose)}
[data-theme="dark"] .dur-chip.on{color:#F4E9EE}
.dur-custom{width:92px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--border2);background:var(--bg2);color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.break-sug{font-size:13px;color:var(--text3)}
.focus-big{font-size:44px}
/* ============ forms ============ */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:800;color:var(--text2)}
.field label .opt{font-weight:600;color:var(--text3)}
.input,select.input,textarea.input{font:inherit;font-size:14.5px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);transition:border-color .15s,box-shadow .15s;width:100%}
.input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
textarea.input{min-height:76px;resize:vertical}
textarea.short{min-height:56px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ob-chip{padding:10px 16px;border-radius:999px;border:1.5px solid var(--border2);font-weight:700;font-size:14px;background:var(--card);color:var(--text2);transition:.15s}
.ob-chip:hover{border-color:var(--pink)}
.ob-chip.on{background:var(--pink-soft);border-color:var(--pink);color:var(--rose)}
[data-theme="dark"] .ob-chip.on{color:#F4E9EE}
.ob-chip.sm{padding:7px 13px;font-size:13px}
.ms-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 8px 8px 14px;font-size:14px;margin-bottom:6px}
.ms-add{display:flex;gap:8px}
.ms-add .input{flex:1}
/* ============ modal / toast / pill ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(42,22,32,.42);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s}
.modal{background:var(--card);border:1px solid var(--border);border-radius:24px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:26px 26px 22px;box-shadow:var(--shadow-lg);animation:popIn .25s cubic-bezier(.2,.9,.3,1.15)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h3{font-size:19px;font-weight:800}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.confirm-msg{color:var(--text2)}
#toasts{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:260;align-items:flex-end;pointer-events:none}
.toast{background:var(--toast-bg);color:var(--toast-fg);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;max-width:340px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(12px);transition:.3s}
.toast.show{opacity:1;transform:none}
#minipill{position:fixed;bottom:22px;right:22px;z-index:100}
.pill{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--pink);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:var(--shadow-lg);cursor:pointer;transition:transform .15s}
.pill:hover{transform:translateY(-2px)}
.pill-label{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--rose)}
.pill-clock{font-family:'Plus Jakarta Sans';font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.pill-btn{width:38px;height:38px;border-radius:50%;background:var(--pink-soft);color:var(--rose);display:flex;align-items:center;justify-content:center}
/* ============ charts ============ */
.wchart{display:flex;gap:8px;align-items:stretch}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;border-radius:10px;transition:.15s}
.wcol:hover{background:var(--card2)}
.wval{font-size:11px;font-weight:800;color:var(--text3);height:15px;font-variant-numeric:tabular-nums}
.wbar-wrap{height:110px;width:100%;max-width:36px;display:flex;align-items:flex-end;background:var(--card2);border-radius:9px;overflow:hidden;margin:0 auto}
.wbar{width:100%;border-radius:9px;background:var(--pink2);transform-origin:bottom;animation:grow .55s ease both}
.wbar.today{background:var(--rose)}
.wcol.sel .wbar{background:var(--rose);box-shadow:inset 0 0 0 2px var(--gold)}
.wlabel{font-size:11px;color:var(--text3);font-weight:700}
.chart-detail{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);font-size:13px;color:var(--text2);line-height:1.6}
/* heatmap */
.hm-scroll{overflow-x:auto;padding-bottom:6px}
.hm{display:flex;gap:4px;min-width:max-content}
.hm-wd{display:grid;grid-template-rows:repeat(7,12px);gap:4px;font-size:9px;color:var(--text3);align-items:center;padding-top:18px;font-weight:700}
.hm-col{display:flex;flex-direction:column;gap:4px}
.hm-mo{height:14px;font-size:10px;color:var(--text3);font-weight:700}
.hm-days{display:grid;grid-template-rows:repeat(7,12px);gap:4px}
.hm-cell{width:12px;height:12px;border-radius:3px;border:none;padding:0;transition:transform .12s}
.hm-cell:hover{transform:scale(1.35)}
.hm-cell.future{background:transparent;border:1px dashed var(--border);cursor:default}
.hm-cell.lv0{background:var(--lv0)}.hm-cell.lv1{background:var(--lv1)}.hm-cell.lv2{background:var(--lv2)}.hm-cell.lv3{background:var(--lv3)}.hm-cell.lv4{background:var(--lv4)}
.hm-legend{display:flex;align-items:center;gap:5px;margin-top:12px;font-size:11.5px;color:var(--text3);font-weight:700}
.hm-legend .hm-cell{cursor:default}
.hm-legend .hm-cell:hover{transform:none}
/* subject bars */
.sb-row{display:grid;grid-template-columns:110px 1fr 64px;gap:12px;align-items:center;margin-bottom:11px}
.sb-name{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sb-tag{font-size:10px;font-weight:800;color:var(--terra);background:var(--terra-soft);padding:2px 7px;border-radius:999px;white-space:nowrap}
.sb-track{height:9px;border-radius:5px;background:var(--card2);overflow:hidden}
.sb-bar{height:100%;border-radius:5px;background:var(--pink);animation:growW .6s ease both;transform-origin:left}
.sb-val{font-size:13px;font-weight:800;color:var(--text2);text-align:right;font-variant-numeric:tabular-nums}
.sb-zero{margin-top:6px}
/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:13px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow)}
.stat .v{font-family:'Plus Jakarta Sans';font-weight:800;font-size:22px;display:flex;align-items:baseline;gap:5px}
.stat .l{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.stat .s{font-size:12px;color:var(--text3);margin-top:2px}
/* ============ goals / journey ============ */
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-bottom:34px}
.goal{display:flex;flex-direction:column;gap:13px}
.goal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.goal-head h3{font-size:17px;font-weight:800}
.goal-desc{color:var(--text2);font-size:13.5px}
.goal-prog{display:flex;align-items:center;gap:16px}
.goal-prog .gp-txt{flex:1;display:flex;flex-direction:column;gap:3px}
.gp-big{font-family:'Plus Jakarta Sans';font-weight:800;font-size:15px}
.gp-sub{font-size:12.5px;color:var(--text3)}
.goal-ms{display:flex;flex-direction:column;gap:5px}
.gms{display:flex;gap:9px;align-items:center;font-size:13.5px;color:var(--text2);cursor:pointer}
.gms .task-check{width:20px;height:20px;margin:0}
.gms.done span{color:var(--text3);text-decoration:line-through}
.reward{border:1.5px dashed var(--gold);background:var(--gold-soft);border-radius:14px;padding:12px 14px;display:flex;gap:11px;align-items:center;font-size:13.5px}
.reward .ric{color:var(--gold);display:flex}
.reward b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
.goal-achieved{background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:14px;text-align:center}
.goal-achieved .ga-t{font-family:'Plus Jakarta Sans';font-weight:800;color:var(--gold);font-size:16px}
.goal-achieved p{font-size:13.5px;color:var(--text2)}
.timeline{position:relative;margin-top:8px}
.tl-stage{position:relative;padding:0 0 16px 36px}
.tl-stage::before{content:'';position:absolute;left:11px;top:28px;bottom:0;width:2px;background:var(--border)}
.tl-stage:last-child::before{display:none}
.tl-dot{position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--border2);background:var(--card);display:flex;align-items:center;justify-content:center;color:transparent}
.tl-stage.done .tl-dot{background:var(--rose);border-color:var(--rose);color:#fff}
.tl-stage.done .tl-dot .ic{width:12px;height:12px}
.tl-stage.current .tl-dot{border-color:var(--rose);box-shadow:0 0 0 5px var(--pink-soft)}
.tl-body{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tl-name{font-weight:800;font-family:'Plus Jakarta Sans';font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-meta{font-size:12px;color:var(--text3);margin-top:3px}
.tl-bar{width:130px;height:6px;border-radius:3px;background:var(--card);overflow:hidden;border:1px solid var(--border)}
.tl-bar i{display:block;height:100%;background:var(--pink);border-radius:3px}
.status-pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.status-pill.not{background:var(--card2);color:var(--text3)}
.status-pill.inp{background:var(--pink-soft);color:var(--rose)}
[data-theme="dark"] .status-pill.inp{color:#F4E9EE}
.status-pill.done{background:var(--rose);color:#fff}
[data-theme="dark"] .status-pill.done{color:#2A1B22}
.tl-stage.final .tl-name{color:var(--gold)}
.tl-actions{display:flex;gap:2px}
/* ============ achievements ============ */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.ach{display:flex;flex-direction:column;gap:8px;padding:18px;position:relative;overflow:hidden}
.ach.locked{opacity:.78}
.ach .ach-ic{font-size:26px}
.ach h4{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
.ach p{font-size:12.5px;color:var(--text2);flex:1}
.ach .ach-bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.ach .ach-bar i{display:block;height:100%;border-radius:3px;background:var(--pink2);transition:width .6s}
.ach.unlocked .ach-bar i{background:var(--gold)}
.ach .ach-prog{font-size:12px;font-weight:800;color:var(--text3)}
.ach.unlocked{border-color:var(--gold)}
.ach.unlocked::after{content:'✓';position:absolute;top:12px;right:14px;color:var(--gold);font-weight:800}
.ach.unlocked .ach-prog{color:var(--gold)}
/* ============ calendar ============ */
.cal-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head h3{font-size:17px;font-weight:800;text-transform:capitalize}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow span{text-align:center;font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{aspect-ratio:1/.92;border-radius:13px;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:.15s;font-variant-numeric:tabular-nums}
.cal-day:hover{background:var(--card2)}
.cal-day.other{opacity:.32}
.cal-day.today{border-color:var(--pink)}
.cal-day.sel{background:var(--pink-soft);border-color:var(--pink)}
.cd-n{font-weight:700;font-size:14px}
.cd-act{width:24px;height:4px;border-radius:2px;background:var(--lv0)}
.cd-act.lv1{background:var(--lv1)}.cd-act.lv2{background:var(--lv2)}.cd-act.lv3{background:var(--lv3)}.cd-act.lv4{background:var(--lv4)}
.cd-act.lv0{background:var(--border)}
.cal-detail-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:14px}
.cal-detail-row b{font-family:'Plus Jakarta Sans'}
/* ============ reflections ============ */
.refl-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0;align-items:start}
.stars{display:flex;gap:6px}
.star{font-size:28px;color:var(--border2);transition:.15s;line-height:1}
.star:hover{transform:scale(1.15)}
.star.on{color:var(--gold)}
.refl-past{display:flex;flex-direction:column;gap:12px}
.refl-item .ri-date{font-weight:800;font-size:13px;color:var(--rose)}
.refl-item .ri-stars{color:var(--gold);font-size:13px;letter-spacing:2px}
.refl-item p{font-size:13.5px;color:var(--text2);margin-top:4px}
.tomorrow-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.tomorrow-row .tr-t{font-weight:700;font-size:14px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.sg-item{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.sg-item b{font-family:'Plus Jakarta Sans';font-size:17px;display:block}
.sg-item span{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
/* ============ settings ============ */
.settings-stack{display:flex;flex-direction:column;gap:18px;max-width:680px}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--border2);font-weight:700;cursor:pointer;font-size:14px}
.radio-pill input{accent-color:var(--rose)}
.radio-pill:has(input:checked){border-color:var(--pink);background:var(--pink-soft);color:var(--rose)}
[data-theme="dark"] .radio-pill:has(input:checked){color:#F4E9EE}
/* ============ onboarding ============ */
#onboard{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto}
.ob-deco{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
.ob-deco.a{width:420px;height:420px;background:var(--pink-soft);top:-120px;right:-100px}
.ob-deco.b{width:360px;height:360px;background:var(--gold-soft);bottom:-140px;left:-110px}
.ob-card{position:relative;max-width:620px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:38px 38px 30px;box-shadow:var(--shadow-lg);animation:fadeUp .4s ease}
.ob-dots{display:flex;gap:7px;justify-content:center;margin:22px 0 4px}
.ob-dot{width:8px;height:8px;border-radius:99px;background:var(--border2);transition:.3s}
.ob-dot.on{background:var(--pink);width:24px}
.ob-step{animation:fadeUp .35s ease}
.ob-title{font-size:clamp(26px,4.5vw,36px);font-weight:600;line-height:1.15;margin-bottom:10px}
.ob-sub{color:var(--text2);font-size:15.5px;margin-bottom:22px}
.ob-tag{font-size:10.5px;font-weight:800;letter-spacing:.22em;color:var(--pink);text-transform:uppercase;margin-bottom:18px}
.ob-btns{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
.ob-err{color:var(--terra);font-size:13px;font-weight:700;min-height:18px;margin-top:8px}
.ob-chips{display:flex;flex-wrap:wrap;gap:9px}
.ob-recap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.ob-recap div{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.ob-recap b{display:block;font-family:'Plus Jakarta Sans';font-size:15px}
.ob-recap span{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
/* ============ sheet / bottom nav ============ */
.sheet{position:fixed;inset:0;z-index:140;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(42,22,32,.4)}
.sheet-panel{position:absolute;bottom:0;left:0;right:0;background:var(--bg2);border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:slideUp .28s cubic-bezier(.2,.9,.3,1)}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.streak-chip{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:800;white-space:nowrap}
/* ============ confetti ============ */
#confetti-root{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti-p{position:absolute;top:-14px;border-radius:2.5px;animation:confFall var(--d) ease-in var(--dl) forwards;opacity:0}
/* ============ ambient floaters ============ */
#ambient{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.amb{position:absolute;bottom:-24px;color:var(--pink2);animation:ambFloat var(--d) linear var(--dl) infinite;pointer-events:none;user-select:none}
@keyframes ambFloat{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.4}80%{opacity:.3}100%{transform:translate(var(--sw),-105vh) rotate(160deg);opacity:0}}
/* ============ Mochi: fully calm 2D companion (no idle animation) ============ */
#companion{position:fixed;left:0;top:0;z-index:95;will-change:transform}
#companion.dragging{z-index:150}
.comp{position:relative;display:block;width:108px;padding:0;background:none;border:none;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent}
.comp:active{cursor:grabbing}
.comp-shadow{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);width:64px;height:11px;border-radius:50%;background:rgba(176,84,112,.13)}
#companion.dragging .comp-shadow{opacity:.35}
/* NO breathing, NO drop-shadow, NO idle body animation — perfectly still when idle */
.comp-svg{position:relative;display:block;width:100%;height:auto}
/* walking: body stays level; only feet, ears, arms, bow move subtly (1.8s, small) */
.foot{transform-box:fill-box}
.comp.moving .foot-l{animation:stepL 1.8s ease-in-out infinite}
.comp.moving .foot-r{animation:stepR 1.8s ease-in-out infinite}
@keyframes stepL{0%,100%{transform:translateX(0)}50%{transform:translateX(4.5px)}}
@keyframes stepR{0%,100%{transform:translateX(4.5px)}50%{transform:translateX(0)}}
.arm{transform-box:fill-box;transform-origin:50% 12%;transition:transform .9s cubic-bezier(.34,1.3,.4,1)}
.arm-l{transform:rotate(-7deg)}
.arm-r{transform:rotate(7deg)}
.comp.moving .arm-l{animation:swingL 1.8s ease-in-out infinite}
.comp.moving .arm-r{animation:swingR 1.8s ease-in-out infinite}
@keyframes swingL{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-11deg)}}
@keyframes swingR{0%,100%{transform:rotate(3deg)}50%{transform:rotate(11deg)}}
.ear{transform-box:fill-box;transform-origin:50% 96%;transition:transform .7s ease}
.comp.moving .ear-l{animation:earSwayL 1.8s ease-in-out infinite}
.comp.moving .ear-r{animation:earSwayR 1.8s ease-in-out infinite}
@keyframes earSwayL{0%,100%{transform:rotate(0)}50%{transform:rotate(-3.5deg)}}
@keyframes earSwayR{0%,100%{transform:rotate(0)}50%{transform:rotate(3.5deg)}}
.bow{transform-box:fill-box;transform-origin:50% 80%;transition:transform .7s ease}
.comp.moving .bow{animation:bowBob 1.8s ease-in-out infinite}
@keyframes bowBob{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
/* sleeping: droopy ears + soft dim */
#companion.asleep .ear-l{transform:rotate(-14deg)}
#companion.asleep .ear-r{transform:rotate(14deg)}
#companion.asleep .comp-svg{opacity:.94}
/* celebrations only */
.comp.wiggle .ear-l{animation:earWigL 1.1s ease}
.comp.wiggle .ear-r{animation:earWigR 1.1s ease}
@keyframes earWigL{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}65%{transform:rotate(5deg)}}
@keyframes earWigR{0%,100%{transform:rotate(0)}30%{transform:rotate(9deg)}65%{transform:rotate(-5deg)}}
.tail{transform-box:fill-box;transform-origin:40% 50%}
.comp.wiggle .tail{animation:tailW 1.1s ease}
@keyframes tailW{0%,100%{transform:scale(1)}40%{transform:scale(1.16,.92)}70%{transform:scale(.96,1.03)}}
.comp.hugging .arm-l{transform:rotate(76deg)}
.comp.hugging .arm-r{transform:rotate(-76deg)}
.comp.hop .comp-svg{animation:compHop 1.05s cubic-bezier(.3,1.2,.5,1)}
@keyframes compHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
.comp.squish .comp-svg{animation:compSquish .6s ease}
@keyframes compSquish{0%{transform:scale(1)}40%{transform:scale(1.05,.95)}100%{transform:scale(1)}}
.comp.spin .comp-svg{animation:compSpin .9s cubic-bezier(.4,.1,.3,1)}
@keyframes compSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.05)}100%{transform:rotate(360deg) scale(1)}}
/* face: only a slow blink */
.ce-open{transform-box:fill-box;transform-origin:center;animation:compBlink 6.5s infinite}
@keyframes compBlink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.06)}98%{transform:scaleY(1)}}
.pupils{transition:transform .6s ease}
.nose{transform-box:fill-box;transform-origin:center}
.comp.twitch .nose{animation:noseTw .5s ease}
@keyframes noseTw{0%,100%{transform:scale(1)}30%{transform:scale(1.25,.85)}60%{transform:scale(.95,1.05)}}
.ce-happy,.ce-sleepy,.ce-brows,.cm-open,.cm-flat,.sweat{display:none}
.comp.st-happy .ce-open,.comp.st-sleepy .ce-open,.comp.st-rest .ce-open{display:none}
.comp.st-happy .ce-happy{display:block}
.comp.st-sleepy .ce-sleepy,.comp.st-rest .ce-sleepy{display:block}
.comp.st-focus .ce-brows,.comp.st-focus .sweat{display:block}
.comp.st-focus .cm-smile{display:none}.comp.st-focus .cm-flat{display:block}
.comp.st-happy .cm-smile{display:none}.comp.st-happy .cm-open{display:block}
.comp.st-sleepy .cm-smile{display:none}.comp.st-sleepy .cm-flat{display:block}
.sweat{transform-box:fill-box}
.comp.st-focus .sweat{animation:sweatDrop 2.8s ease-in infinite}
@keyframes sweatDrop{0%{transform:translateY(-3px);opacity:0}30%{opacity:.9}100%{transform:translateY(10px);opacity:0}}
/* speech bubble with chat buttons */
.comp-bubble{position:absolute;left:0;bottom:calc(100% + 12px);width:max-content;max-width:min(250px,76vw);background:var(--card);border:1.5px solid var(--border2);border-radius:14px;padding:9px 13px;font-size:12.5px;font-weight:800;color:var(--text);box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:.3s;pointer-events:none;z-index:2}
.comp-bubble.show{opacity:1;transform:translateY(0)}
.comp-bubble.interactive{pointer-events:auto}
.comp-bubble::after{content:'';position:absolute;bottom:-6.5px;left:26px;width:11px;height:11px;background:var(--card);border-right:1.5px solid var(--border2);border-bottom:1.5px solid var(--border2);transform:rotate(45deg)}
.comp-bubble.flip{left:auto;right:0}
.comp-bubble.flip::after{left:auto;right:26px}
.cb-btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.cb-btns button{font:inherit;font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--pink-soft);color:var(--rose);border:1px solid var(--pink);cursor:pointer;transition:.15s}
[data-theme="dark"] .cb-btns button{color:#F4E9EE}
.cb-btns button:hover{filter:brightness(1.06);transform:translateY(-1px)}
.cb-btns button:active{transform:scale(.95)}
.zzz{position:absolute;top:-12px;right:-2px;width:40px;height:58px;display:none;pointer-events:none}
#companion.asleep .zzz{display:block}
.zzz span{position:absolute;right:2px;bottom:40px;font-family:'Plus Jakarta Sans';font-weight:800;font-size:12px;color:var(--text3);animation:zfloat 3.6s ease-out infinite}
.zzz span:nth-child(2){animation-delay:1.2s;font-size:15px}
.zzz span:nth-child(3){animation-delay:2.4s;font-size:18px}
@keyframes zfloat{0%{transform:translate(0,0) scale(.8);opacity:0}30%{opacity:.85}100%{transform:translate(14px,-38px) scale(1.1);opacity:0}}
.hpop{position:absolute;bottom:70px;color:#EE7D9B;font-size:15px;pointer-events:none;z-index:2;animation:hpop 1.9s ease-out forwards}
@keyframes hpop{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.95}100%{transform:translate(var(--hx,0),-84px) scale(1.1) rotate(var(--hr,0deg));opacity:0}}
/* ============ animations ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(8px)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growW{from{transform:scaleX(0)}}
@keyframes slideUp{from{transform:translateY(100%)}}
@keyframes confFall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:.85;transform:translate(var(--dx),106vh) rotate(560deg)}}
/* ============ responsive ============ */
@media(max-width:960px){
  .dash-grid,.cal-layout,.refl-grid{grid-template-columns:1fr}
}
@media(max-width:900px){
  .sidebar{display:none}
  .main{margin-left:0}
  .page{padding:20px 18px 190px}
  .topbar{display:flex;position:sticky;top:0;z-index:60;background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;align-items:center;justify-content:space-between;gap:10px}
  .topbar-right{display:flex;align-items:center;gap:6px}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:90;justify-content:space-around}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--text3);padding:7px 2px;border-radius:10px;transition:.15s}
  .bn-item:active{transform:scale(.92)}
  .bn-item.active{color:var(--rose)}
  #toasts{left:16px;right:16px;top:72px;bottom:auto;align-items:center}
  #minipill{bottom:calc(82px + env(safe-area-inset-bottom));right:12px;left:auto}
  .pill{padding:6px 6px 6px 14px}
  .pill-clock{font-size:17px}
  .frow{grid-template-columns:1fr}
  .sb-row{grid-template-columns:88px 1fr 56px}
  .comp{width:78px}
  .hpop{bottom:52px;font-size:13px}
  .comp-bubble{max-width:min(220px,72vw)}
}
@media (prefers-reduced-motion: reduce){

'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const round1=v=>Math.round(v*10)/10;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reducedMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>dateKey(new Date());
const tomorrowKey=()=>{const d=new Date();d.setDate(d.getDate()+1);return dateKey(d);};
const keyToDate=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const diffKeys=(a,b)=>Math.round((keyToDate(b)-keyToDate(a))/864e5);
const fmtMin=m=>{m=Math.round(m);if(m<60)return m+'m';const h=Math.floor(m/60),r=m%60;return r?`${h}h ${r}m`:`${h}h`;};
const fmtClock=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${pad(s%60)}`;};
const fmtDateLong=k=>keyToDate(k).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const fmtDateShort=k=>keyToDate(k).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const niceDate=k=>k===todayKey()?'Today':k===tomorrowKey()?'Tomorrow':fmtDateShort(k);
const dayOfYear=()=>{const n=new Date();return Math.floor((n-new Date(n.getFullYear(),0,0))/864e5);};
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function weekKeys(){const m=mondayOf(new Date());const out=[];for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);out.push(dateKey(d));}return out;}
function monthKeys(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),days=new Date(y,m+1,0).getDate(),out=[];for(let i=1;i<=days;i++)out.push(dateKey(new Date(y,m,i)));return out;}

};
const icon=(n,cls='')=>`<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;

/* ================= state ================= */
const KEY='sprout.planner.v1';
let state=null;
const defaultState=()=>({version:1,user:null,tasks:[],goals:[],sessions:[],reflections:{},achievements:{},journey:{stages:[]},timer:null});
function loadState(){
  try{const raw=localStorage.getItem(KEY);if(!raw)return null;const p=JSON.parse(raw);if(!p||!p.user)return null;return {...defaultState(),...p};}catch(e){return null;}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
const U=()=>state.user;
const findTask=id=>state.tasks.find(t=>t.id===id);
const findGoal=id=>state.goals.find(g=>g.id===id);

/* 32 calm, motivating quotes */
const QUOTES=[
 "You don't need to finish everything today. You just need to move forward.",
 "One focused hour is worth three distracted ones.",
 "Slow progress is still progress.",
 "Consistency beats intensity — show up again tomorrow.",
 "Every problem you solve makes the next one smaller.",
 "Small steps, taken daily, quietly become distances.",
 "You are building something, even when it feels slow.",
 "Discipline is remembering what you want most.",
 "Trust the hours you've already invested.",
 "The offer letter is written one focused session at a time.",
 "Rest is part of the work. So is starting again.",
 "Compare yourself only to yesterday's you.",
 "Little by little, a little becomes a lot.",
 "Study slowly, understand deeply.",
 "One page a day is 365 pages a year.",
 "Your future self is watching you right now.",
 "Progress hides inside boring days.",
 "Start where you are. Use what you have.",
 "Done is better than perfect. Started is better than done.",
 "Focus is deciding what not to do.",
 "Quiet work, loud results.",
 "It always seems impossible until it's done.",
 "Slow study is still study.",
 "Every expert was once a beginner who refused to quit.",
 "The syllabus is finite. Your effort compounds.",
 "You are allowed to be both a masterpiece and a work in progress.",
 "Care about your future enough to work for it now.",
 "Small daily improvements create staggering long-term results.",
 "The exam tests memory. The job tests consistency.",
 "Discipline is self-love in work clothes.",
 "You don't have to be great to start. You have to start to be great.",
 "Energy flows where attention goes — guard it kindly.",
];
const dayQuote=()=>QUOTES[dayOfYear()%QUOTES.length];

/* ================= derived data ================= */
const sessionsOn=k=>state.sessions.filter(s=>s.dateKey===k);
const minutesOn=k=>sessionsOn(k).reduce((a,s)=>a+s.focusedSec,0)/60;
const todayMinutes=()=>minutesOn(todayKey());
const dailyGoalMin=()=>U().dailyHours*60;
const todayGoalPct=()=>Math.min(100,todayMinutes()/dailyGoalMin()*100);
const journeyDay=()=>{const c=new Date(U().createdAt);const a=new Date(c.getFullYear(),c.getMonth(),c.getDate());const n=new Date();const b=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.max(1,Math.floor((b-a)/864e5)+1);};
function studiedMap(){const m={};state.sessions.forEach(s=>{m[s.dateKey]=(m[s.dateKey]||0)+s.focusedSec/60;});return m;}
function streaks(perDay){
  const m=perDay||studiedMap();const has=k=>(m[k]||0)>=15;
  let cur=0;const d=new Date();
  if(!has(dateKey(d)))d.setDate(d.getDate()-1);
  while(has(dateKey(d))){cur++;d.setDate(d.getDate()-1);}
  const keys=Object.keys(m).filter(has).sort();
  let longest=0,run=0,prev=null;
  keys.forEach(k=>{if(prev&&diffKeys(prev,k)===1)run++;else run=1;longest=Math.max(longest,run);prev=k;});
  let goalDays=0;Object.keys(m).forEach(k=>{if(m[k]>=dailyGoalMin())goalDays++;});
  return {cur,longest,days:keys.length,goalDays};
}
function goalProgress(g){
  if(g.achievedAt)return{pct:100,doneMin:0,targetMin:0,msDone:0,msTotal:g.milestones.length};
  const targetMin=(+g.targetHours||0)*60;
  const doneMin=state.sessions.filter(s=>s.goalId===g.id).reduce((a,s)=>a+s.focusedSec,0)/60;
  if(targetMin>0)return{pct:Math.min(100,doneMin/targetMin*100),doneMin,targetMin};
  if(g.milestones&&g.milestones.length){const d=g.milestones.filter(m=>m.done).length;return{pct:d/g.milestones.length*100,doneMin,targetMin:0,msDone:d,msTotal:g.milestones.length};}
  return{pct:0,doneMin,targetMin:0,msDone:0,msTotal:0};
}
function stageProgress(st){
  if(st.status==='done')return 100;
  const subs=st.subjects||[];if(!subs.length)return 0;
  const rel=state.tasks.filter(t=>subs.includes(t.subject));
  if(!rel.length)return 0;
  return rel.filter(t=>t.completed).length/rel.length*100;
}
function computeStats(){
  const s={};let total=0,longest=0;const subj={},perDay={};
  state.sessions.forEach(x=>{total+=x.focusedSec;longest=Math.max(longest,x.focusedSec);subj[x.subject]=(subj[x.subject]||0)+x.focusedSec/60;perDay[x.dateKey]=(perDay[x.dateKey]||0)+x.focusedSec/60;});
  s.totalMin=total/60;s.longestSessionMin=longest/60;s.sessionCount=state.sessions.length;s.subjectMin=subj;s.perDay=perDay;
  s.todayMin=perDay[todayKey()]||0;
  s.weekMin=weekKeys().reduce((a,k)=>a+(perDay[k]||0),0);
  s.monthMin=monthKeys().reduce((a,k)=>a+(perDay[k]||0),0);
  s.avgDaily=s.totalMin/Math.max(1,journeyDay());
  s.tasksDone=state.tasks.filter(t=>t.completed).length;
  s.tasksPending=state.tasks.length-s.tasksDone;
  const st=streaks(perDay);Object.assign(s,{curStreak:st.cur,longestStreak:st.longest,daysStudied:st.days,goalDays:st.goalDays});
  s.goalsDone=state.goals.filter(g=>g.achievedAt).length;
  const dsaGoals=state.goals.filter(g=>(g.subjects||[]).some(x=>/dsa/i.test(x)));
  if(dsaGoals.length)s.dsaPct=Math.max(...dsaGoals.map(g=>goalProgress(g).pct));
  else{const dt=state.tasks.filter(t=>/dsa/i.test(t.subject));s.dsaPct=dt.length?dt.filter(t=>t.completed).length/dt.length*100:0;}
  const n=state.journey.stages.length;
  s.journeyPct=n?state.journey.stages.filter(x=>x.status==='done').length/n*100:0;
  return s;
}

/* ================= achievements ================= */
const ACH_DEFS=[
 {id:'first',em:'🌱',name:'First Step',desc:'Complete your first focus session.',cur:s=>s.sessionCount,target:1,fmt:c=>`${Math.min(c,1)} / 1 session`},
 {id:'streak3',em:'🔥',name:'Getting Consistent',desc:'Study for 3 consecutive days.',cur:s=>s.longestStreak,target:3,fmt:c=>`${Math.min(c,3)} / 3 days`},
 {id:'streak7',em:'⚡',name:'One Week Strong',desc:'Maintain a 7-day streak.',cur:s=>s.longestStreak,target:7,fmt:c=>`${Math.min(c,7)} / 7 days`},
 {id:'h10',em:'📚',name:'10 Hours',desc:'Complete 10 hours of focused study.',cur:s=>s.totalMin,target:600,fmt:c=>`${fmtMin(Math.min(c,600))} / 10h`},
 {id:'tasks50',em:'🎯',name:'50 Tasks',desc:'Complete 50 study tasks.',cur:s=>s.tasksDone,target:50,fmt:c=>`${Math.min(c,50)} / 50 tasks`},
 {id:'dsa',em:'💻',name:'DSA Milestone',desc:'Complete your chosen DSA target.',cur:s=>s.dsaPct,target:100,fmt:c=>`${Math.floor(Math.min(c,100))}% of your DSA goal`},
 {id:'h100',em:'🏆',name:'100 Hours',desc:'Complete 100 hours of focused preparation.',cur:s=>s.totalMin,target:6000,fmt:c=>`${fmtMin(Math.min(c,6000))} / 100h`},
 {id:'ready',em:'🚀',name:'Placement Ready',desc:'Complete your entire placement preparation plan.',cur:s=>s.journeyPct,target:100,fmt:c=>`${Math.floor(Math.min(c,100))}% of your journey`},
];
function checkAchievements(){
  const s=computeStats();let unlocked=false;
  ACH_DEFS.forEach(d=>{
    if(!state.achievements[d.id]&&d.cur(s)>=d.target){
      state.achievements[d.id]=Date.now();unlocked=true;
      setTimeout(()=>{toast(`Achievement unlocked — ${d.name} ${d.em}`);confetti(14);compMood('happy',`Achievement! ${d.name} ${d.em} ♡`,5000);},700);
    }
  });
  if(unlocked)save();
}
function checkGoalCompletions(){
  const newly=[];
  state.goals.forEach(g=>{if(!g.achievedAt&&goalProgress(g).pct>=100){g.achievedAt=Date.now();newly.push(g);}});
  if(newly.length){
    save();
    setTimeout(()=>{toast('You finished something you once planned to start. 🎉');confetti(44);compSpin();compHug();compSay('GOAL COMPLETE!! You earned your reward ♡🎉',6500);},400);
  }
}

function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  $('#toasts').appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),350);},3800);

function confetti(n=26){
  if(reducedMotion())return;
  const root=$('#confetti-root');
  const colors=['#E28FA4','#C29B4C','#EDABC0','#C25E7B','#F4D6E0','#AC4A6A'];
  for(let i=0;i<n;i++){
    const p=document.createElement('span');p.className='confetti-p';
    const sz=5+Math.random()*6;
    p.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${sz*0.6}px;background:${colors[i%colors.length]};--d:${(0.9+Math.random()*1.3).toFixed(2)}s;--dl:${(Math.random()*0.35).toFixed(2)}s;--dx:${(Math.random()*160-80).toFixed(0)}px;`;
    root.appendChild(p);
  }
  setTimeout(()=>{root.innerHTML='';},2600);
}

function ringHTML(pct,{size=150,stroke=13,key=null,center='',gold=false,live=false}={}){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-clamp(pct,0,100)/100);
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px;max-width:100%">
    <svg viewBox="0 0 ${size} ${size}">
      <circle class="ring-track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" fill="none"/>
      <circle class="ring-fill ${gold?'gold':''} ${live?'live':''}" ${key?`data-key="${key}"`:''} ${live?'id="f-ring"':''} data-c="${c}" data-off="${off}" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg><div class="ring-center">${center}</div></div>`;
}
const lastRingOff={};
function animateRings(){
  $$('.ring-fill:not(.live)').forEach(el=>{
    const key=el.dataset.key;if(!key)return;
    const c=+el.dataset.c,off=+el.dataset.off;
    const prev=(key in lastRingOff)?lastRingOff[key]:c;
    el.style.transition='none';el.style.strokeDashoffset=prev;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transition='';el.style.strokeDashoffset=off;}));
    lastRingOff[key]=off;
  });
}

function frame2D(){
  if(!c2.ready)return;
  if(state&&state.user&&U().compHidden)return;
  const now=performance.now();
  const dt=Math.min((now-(frame2D.last||now))/1000,0.05);frame2D.last=now;
  const reduced=reducedMotion();
  const modalOpen=document.body.style.overflow==='hidden';
  const onBreak=state&&state.timer&&state.timer.mode==='break';
  /* target */
  if(c2.dragging&&c2.dragPt){c2.cur={...c2.dragPt};c2.tar={...c2.dragPt};}
  else if(c2.chatOpen||c2.sleepy){c2.tar={...c2.cur};}
  else if(modalOpen||onBreak){c2.tar=clampPos(anchorPos());}
  else if(!reduced&&!isMobileView()&&c2.mouseMoved&&now-c2.lastMouseMove<4000){
    c2.tar=clampPos({x:c2.mouse.x+compSize()/2+52,y:c2.mouse.y+compHalfH()+84});

  }
  else if(!reduced&&!isMobileView()&&c2.mouseMoved&&now-c2.lastMouseMove<12000){
    c2.tar=clampPos(nearestCorner());
  }
  if(!(c2.dragging&&c2.dragPt)){
    const k=1-Math.pow(0.12,dt);
    c2.cur.x+=(c2.tar.x-c2.cur.x)*k;
    c2.cur.y+=(c2.tar.y-c2.cur.y)*k;
  }
  const dist=Math.hypot(c2.tar.x-c2.cur.x,c2.tar.y-c2.cur.y);
  c2.prevSpeed=c2.speed;
  c2.speed+=(clamp(dist/150,0,1)-c2.speed)*Math.min(1,dt*5);
  /* walk class with HYSTERESIS — no flicker, no vibration */
  const onThresh=c2.movingFlag?0.09:0.2;
  const wantMoving=!reduced&&!c2.dragging&&!c2.sleepy&&c2.speed>onThresh;
  if(wantMoving){c2.movingOffAt=now+600;c2.movingFlag=true;}
  else if(now>c2.movingOffAt){c2.movingFlag=false;}
  c2.body.classList.toggle('moving',c2.movingFlag);

/* ================= charts ================= */
let chartSelKey=null,heatSelKey=null;
function weekChartHTML(){
  const keys=weekKeys(),mins=keys.map(minutesOn),goal=dailyGoalMin();
  const max=Math.max(goal,...mins,60);
  const labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],tk=todayKey();
  return `<div class="wchart">${keys.map((k,i)=>{
    const h=mins[i]>0?Math.max(7,mins[i]/max*100):0;
    return `<button type="button" class="wcol ${k===(chartSelKey||tk)?'sel':''}" data-action="chart-day" data-key="${k}">
      <span class="wval">${mins[i]?fmtMin(mins[i]):''}</span>
      <div class="wbar-wrap"><div class="wbar ${k===tk?'today':''}" style="height:${h}%;animation-delay:${i*45}ms"></div></div>
      <span class="wlabel">${labels[i]}</span></button>`;
  }).join('')}</div>`;
}
function dayDetailHTML(k){
  const m=minutesOn(k),sess=sessionsOn(k);
  const done=state.tasks.filter(t=>t.date===k&&t.completed).length;
  const subs=[...new Set(sess.map(s=>s.subject))];
  return `<strong>${fmtDateLong(k)}</strong> · ${fmtMin(m)} focused · ${done} task${done!==1?'s':''} completed · ${sess.length} session${sess.length!==1?'s':''}${subs.length?` · ${subs.map(esc).join(', ')}`:''}`;
}
function heatLevel(min){
  if(min<=0)return 0;const r=min/dailyGoalMin();
  return r>=1?4:r>=.5?3:r>=.25?2:1;
}
function heatmapHTML(){
  const end=new Date();end.setHours(23,59,59);
  const start=mondayOf(end);start.setDate(start.getDate()-17*7);
  let cols='',prevM=-1;
  for(let w=0;w<18;w++){
    let cells='',label='';
    for(let dow=0;dow<7;dow++){
      const d=new Date(start);d.setDate(start.getDate()+w*7+dow);
      if(d>end){cells+='<span class="hm-cell future"></span>';continue;}
      const k=dateKey(d),lv=heatLevel(minutesOn(k));
      if(dow===0){const m=d.getMonth();if(m!==prevM){label=d.toLocaleDateString('en-US',{month:'short'});prevM=m;}}
      cells+=`<button type="button" class="hm-cell lv${lv}" data-action="heat-day" data-key="${k}" title="${fmtDateShort(k)} · ${fmtMin(minutesOn(k))}" aria-label="${fmtDateShort(k)}"></button>`;
    }
    cols+=`<div class="hm-col"><span class="hm-mo">${label}</span><div class="hm-days">${cells}</div></div>`;
  }
  return `<div class="hm-scroll"><div class="hm">
    <div class="hm-wd"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
    ${cols}</div></div>
    <div class="hm-legend">Less <span class="hm-cell lv0"></span><span class="hm-cell lv1"></span><span class="hm-cell lv2"></span><span class="hm-cell lv3"></span><span class="hm-cell lv4"></span> More &nbsp;·&nbsp; deepest = daily goal reached</div>`;
}
function subjectBarsHTML(){
  const s=computeStats();
  const entries=Object.entries(s.subjectMin).sort((a,b)=>b[1]-a[1]);
  if(!entries.length)return '<p class="empty-line">Your first focused session will appear here.</p>';
  const max=entries[0][1];
  const zero=U().subjects.filter(x=>!s.subjectMin[x]);
  return entries.map(([k,v],i)=>`
    <div class="sb-row"><span class="sb-name">${esc(k)}${(v<max*0.15&&max>=120)?'<span class="sb-tag">needs attention</span>':''}</span>
    <div class="sb-track"><div class="sb-bar" style="width:${Math.max(3,v/max*100)}%;animation-delay:${i*50}ms"></div></div>
    <span class="sb-val">${fmtMin(v)}</span></div>`).join('')
    +(zero.length?`<p class="sb-zero empty-line">No time yet: ${zero.map(esc).join(', ')} — worth a visit soon.</p>`:'');
}

/* ================= tasks ================= */
let taskFilter='all',taskScope='today',dragId=null;
const prioLabel=p=>({low:'Low',medium:'Medium',high:'High'}[p]||'Medium');
function visibleTasks(){
  let arr=[...state.tasks];const tk=todayKey(),tm=tomorrowKey(),wk=weekKeys();
  if(taskScope==='today')arr=arr.filter(t=>t.date===tk||(!t.completed&&t.date&&t.date<tk));
  else if(taskScope==='tomorrow')arr=arr.filter(t=>t.date===tm);
  else if(taskScope==='week')arr=arr.filter(t=>wk.includes(t.date));
  if(taskFilter==='pending')arr=arr.filter(t=>!t.completed);
  else if(taskFilter==='done')arr=arr.filter(t=>t.completed);
  else if(taskFilter==='high')arr=arr.filter(t=>t.priority==='high'&&!t.completed);
  return arr;
}

function bindDrag(){
  const list=$('#task-list');if(!list)return;
  $$('.task',list).forEach(card=>{
    card.draggable=true;
    card.addEventListener('dragstart',e=>{dragId=card.dataset.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId);}catch(_){}});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');$$('.task').forEach(c=>c.classList.remove('drop-target'));dragId=null;});
    card.addEventListener('dragover',e=>{if(!dragId||dragId===card.dataset.id)return;e.preventDefault();card.classList.add('drop-target');});
    card.addEventListener('dragleave',()=>card.classList.remove('drop-target'));
    card.addEventListener('drop',e=>{
      e.preventDefault();card.classList.remove('drop-target');
      if(!dragId||dragId===card.dataset.id)return;
      const from=state.tasks.findIndex(t=>t.id===dragId),to=state.tasks.findIndex(t=>t.id===card.dataset.id);
      if(from<0||to<0)return;
      const[m]=state.tasks.splice(from,1);state.tasks.splice(to,0,m);
      dragId=null;save();renderPage();
    });
  });
}
function moveTask(id,dir){
  const vis=visibleTasks().map(t=>t.id);const i=vis.indexOf(id),j=i+dir;
  if(i<0||j<0||j>=vis.length)return;
  const a=state.tasks.findIndex(t=>t.id===vis[i]),b=state.tasks.findIndex(t=>t.id===vis[j]);
  const[m]=state.tasks.splice(a,1);state.tasks.splice(b,0,m);
  save();renderPage();
}

/* ================= focus engine ================= */
let focusSel={taskId:'free',min:null,custom:'',freeSubject:null};
let justCompleted=null,justBreakDone=false;
function timerElapsed(){const t=state.timer;if(!t)return 0;return t.accumulated+(t.running?(Date.now()-t.startedAt)/1000:0);}
function effDur(){
  if(focusSel.min)return clamp(Math.round(focusSel.min),1,180);
  const t=focusSel.taskId!=='free'?findTask(focusSel.taskId):null;
  if(t&&t.estMin){const rem=t.estMin-t.studiedMin;if(rem>0)return clamp(Math.round(Math.min(rem,U().sessionMin)),1,180);}
  return U().sessionMin;
}
function startFocusFromTask(id){
  if(state.timer){navTo('focus');toast('A session is already running.');return;}
  const t=findTask(id);if(!t||t.completed)return;
  focusSel={taskId:id,min:null,custom:'',freeSubject:focusSel.freeSubject};
  justCompleted=null;justBreakDone=false;
  startFocusSession();
}
function startFocusSession(){
  if(state.timer){toast('A session is already running.');return;}
  if(focusSel.taskId!=='free'&&!state.tasks.find(t=>t.id===focusSel.taskId&&!t.completed))focusSel.taskId='free';
  const min=effDur();
  if(!(min>=1&&min<=180)){toast('Choose a session length between 1 and 180 minutes.');return;}
  const task=focusSel.taskId==='free'?null:findTask(focusSel.taskId);
  const subject=task?task.subject:(focusSel.freeSubject||U().subjects[0]||'General');
  state.timer={mode:'focus',taskId:task?task.id:null,title:task?task.title:'Free focus session',subject,goalId:task?task.goalId:null,plannedSec:min*60,startedAt:Date.now(),sessionStart:Date.now(),accumulated:0,running:true};
  justCompleted=null;justBreakDone=false;
  save();renderApp();toast("Let's get one focused session done.");
  compMood('focus',"Focus time! Go go go~ I'm cheering for you ♡",5000);
}
function startBreak(min){
  if(state.timer&&state.timer.mode==='focus'){toast('Finish your focus session first.');return;}
  min=clamp(Math.round(min),1,60);
  state.timer={mode:'break',plannedSec:min*60,startedAt:Date.now(),accumulated:0,running:true};
  justCompleted=null;justBreakDone=false;
  save();renderApp();
  compMood('rest','Break time! Rest well~ 🌸',5000);
}
function skipBreak(){if(state.timer&&state.timer.mode==='break'){state.timer=null;justBreakDone=true;save();renderApp();compMood('idle','Okay~ back to it! ✨',3000);}}
function pauseTimer(){
  const t=state.timer;if(!t||!t.running)return;
  t.accumulated=timerElapsed();t.running=false;t.startedAt=null;
  save();renderPage();updateMiniPill(true);
  compMood('idle',t.mode==='break'?'Break paused~ no rush ♡':'Paused! Stretch a little~',3200);
}
function resumeTimer(){
  const t=state.timer;if(!t||!t.running)return;
  t.startedAt=Date.now();t.running=true;
  save();renderPage();updateMiniPill(true);
  compMood(t.mode==='break'?'rest':'focus',t.mode==='break'?'Break continues~ ♡':"Let's finish strong~!",3000);
}
function resetTimer(){
  const el=timerElapsed();
  const doReset=()=>{state.timer=null;save();renderApp();toast('Session reset.');compMood('idle','Fresh start~ ♡',2600);};
  if(el>=60)openConfirm('Reset session?','Time in this session won\'t be recorded.','Reset session',doReset);
  else doReset();
}
function finishTimer(){
  const t=state.timer;if(!t)return;
  const el=Math.min(timerElapsed(),t.plannedSec);
  state.timer=null;
  if(t.mode==='break'){
    justBreakDone=true;save();renderApp();toast("Break's over. Ready when you are. 🌸");
    compMood('idle','Recharged and ready! ✨',3200);
    return;
  }
  if(el>=60){
    const sec=Math.round(el);
    const beforePct=todayGoalPct(),beforeStreak=streaks().cur;
    const task=t.taskId?findTask(t.taskId):null;
    state.sessions.push({id:uid(),taskId:t.taskId,title:t.title,subject:t.subject,goalId:task?task.goalId:t.goalId,dateKey:todayKey(),startedAt:t.sessionStart,endAt:Date.now(),focusedSec:sec});
    if(task){
      task.studiedMin=round1(task.studiedMin+sec/60);
      if(!task.completed&&task.estMin&&task.studiedMin>=task.estMin)setTimeout(()=>toast(`Time estimate reached for “${task.title}” — ready to mark it complete.`),1600);
    }
    justCompleted={sec,title:t.title,subject:t.subject};
    const afterStreak=streaks().cur,afterPct=todayGoalPct();
    checkGoalCompletions();checkAchievements();save();
    if(beforePct<100&&afterPct>=100){
      confetti(46);toast('Daily goal complete. You showed up today. 🎯');
      compSpin();compHug();
      setTimeout(()=>compSay('DAILY GOAL COMPLETE!! I\'m so proud of you ♡',6500),400);
    }
    else if(afterStreak>beforeStreak){
      toast(`🔥 ${afterStreak} days of consistency. Keep building.`);
      compMood('happy',`${afterStreak} day streak! We're on fire~ 🔥`,5400);compHearts(4);
    }
    else{
      toast(`${fmtMin(sec/60)} logged${t.subject?` to ${t.subject}`:''}. That's one more step forward.`);
      compMood('happy',`${fmtMin(sec/60)} focused! You did amazing ♡`,5200);compHearts(4);
    }
  }else{
    justCompleted=null;toast("Session under a minute wasn't recorded.");
    compMood('idle','Next time we\'ll focus a little longer~ ♡',3000);
  }
  save();renderApp();
}
function updateTimerUI(){
  const t=state.timer;if(!t)return;
  const el=timerElapsed(),rem=Math.max(0,t.plannedSec-el);
  const clock=$('#f-clock');
  if(clock){
    clock.textContent=fmtClock(rem);
    const ring=$('#f-ring');
    if(ring){const c=+ring.dataset.c;ring.style.strokeDashoffset=String(c*(1-rem/t.plannedSec));}
    const el2=$('#f-elapsed');if(el2)el2.textContent=`Elapsed ${fmtClock(el)} of ${Math.round(t.plannedSec/60)} min`;
    const task=t.taskId?findTask(t.taskId):null;
    const bar=$('#f-taskbar');
    if(bar&&task&&task.estMin){
      bar.style.width=clamp((task.studiedMin+el/60)/task.estMin*100,0,100)+'%';
      const lbl=$('#f-taskbar-l');if(lbl)lbl.textContent=`${fmtMin(task.studiedMin+el/60)} / ${task.estMin} min on this task`;
    }
  }
  updateMiniPill();
  document.title=`${fmtClock(rem)} · ${t.mode==='break'?'Break':'Focus'} — Bloom`;
}
let pillSig='';
function updateMiniPill(force=false){
  const host=$('#minipill'),t=state.timer;
  if(!t||currentPage==='focus'){host.innerHTML='';host.style.display='none';pillSig='';return;}
  const sig=`${t.mode}|${t.running}|${t.taskId||''}`;
  if(!force&&sig===pillSig&&$('#pill-clock')){const rem=Math.max(0,t.plannedSec-timerElapsed());$('#pill-clock').textContent=fmtClock(rem);return;}
  pillSig=sig;host.style.display='block';
  const rem=Math.max(0,t.plannedSec-timerElapsed());
  host.innerHTML=`<div class="pill" data-action="nav" data-nav="focus" role="button" tabindex="0">
    <span class="pill-label">${t.mode==='break'?'BREAK':'FOCUS'}</span>
    <span class="pill-clock" id="pill-clock">${fmtClock(rem)}</span>
    <button type="button" class="pill-btn" data-action="${t.running?'focus-pause':'focus-resume'}" aria-label="${t.running?'Pause':'Resume'}">${icon(t.running?'pause':'play')}</button>
  </div>`;
}
setInterval(()=>{
  const t=state.timer;if(!t){return;}
  if(t.running&&timerElapsed()>=t.plannedSec){finishTimer();return;}
  if(t.mode==='focus'&&t.running&&timerElapsed()>=t.plannedSec/2&&!t.halfSaid){t.halfSaid=true;compSay('Halfway there! Keep going~ ✨',3800);}
  updateTimerUI();
},250);
document.addEventListener('visibilitychange',()=>{const t=state.timer;if(t&&t.running&&timerElapsed()>=t.plannedSec)finishTimer();else updateTimerUI();});

function journeyHTML(){
  const stages=state.journey.stages;
  const doneN=stages.filter(s=>s.status==='done').length;
  const pct=stages.length?Math.round(doneN/stages.length*100):0;
  const curIdx=stages.findIndex(s=>s.status!=='done');
  let html=`<div class="card">
    <div class="card-title"><div style="display:flex;align-items:center;gap:16px">
      <h3>Placement Journey</h3>
      ${stages.length?ringHTML(pct,{size:44,stroke:5,key:'journey',center:`<span style="font-size:11px;font-weight:800">${pct}%</span>`}):''}
    </div>
    <button type="button" class="btn btn-ghost btn-sm" data-action="open-stage-new">${icon('plus','s')} Add Stage</button></div>`;

  }

    const pctS=Math.round(stageProgress(st));
    const isCur=i===curIdx;
    const lbl=st.status==='done'?'Done':(pctS>0||st.status==='in-progress')?'In progress':'Not started';
    const cls=st.status==='done'?'done':(pctS>0||st.status==='in-progress')?'inp':'not';
    return `<div class="tl-stage ${st.status==='done'?'done':''} ${isCur?'current':''} ${i===stages.length-1?'final':''}">
      <div class="tl-dot">${st.status==='done'?icon('check'):''}</div>
      <div class="tl-body card-soft">
        <div>
          <div class="tl-name">${esc(st.name)} ${isCur?`<span class="chip" style="background:var(--pink-soft);color:var(--rose)">you are here</span>`:''}</div>
          <div class="tl-meta">${st.targetDate?'Target '+fmtDateShort(st.targetDate):''}${st.subjects.length?(st.targetDate?' · ':'')+'Tasks in: '+st.subjects.map(esc).join(', '):''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="tl-bar"><i style="width:${pctS}%"></i></div>
          <span class="status-pill ${cls}">${lbl}</span>
          <span class="tl-actions">
            <button type="button" class="btn-icon btn-ghost" data-action="stage-up" data-id="${st.id}" aria-label="Move up">${icon('chevU')}</button>
            <button type="button" class="btn-icon btn-ghost" data-action="stage-down" data-id="${st.id}" aria-label="Move down">${icon('chevD')}</button>
            <button type="button" class="btn-icon btn-ghost" data-action="stage-edit" data-id="${st.id}" aria-label="Edit">${icon('pencil')}</button>

          </span>
        </div>
      </div></div>`;
  }).join('')}</div></div>`;
  return html;
}

function renderCalendar(){
  const first=new Date(calY,calM,1);
  const lead=(first.getDay()+6)%7;
  const daysIn=new Date(calY,calM+1,0).getDate();
  const monthName=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let cells='';
  for(let i=lead;i>0;i--){const d=new Date(calY,calM,-i+1);cells+=`<button type="button" class="cal-day other" data-action="cal-day" data-key="${dateKey(d)}"><span class="cd-n">${d.getDate()}</span></button>`;}
  for(let d=1;d<=daysIn;d++){
    const k=dateKey(new Date(calY,calM,d));
    const lv=heatLevel(minutesOn(k));
    cells+=`<button type="button" class="cal-day ${k===todayKey()?'today':''} ${k===selectedCalKey?'sel':''}" data-action="cal-day" data-key="${k}"><span class="cd-n">${d}</span><span class="cd-act lv${lv}"></span></button>`;
  }
  const trail=(7-((lead+daysIn)%7))%7;
  for(let d=1;d<=trail;d++){const dt=new Date(calY,calM+1,d);cells+=`<button type="button" class="cal-day other" data-action="cal-day" data-key="${dateKey(dt)}"><span class="cd-n">${d}</span></button>`;}
  const k=selectedCalKey;
  const ts=state.tasks.filter(t=>t.date===k),done=ts.filter(t=>t.completed);
  const mins=minutesOn(k),sess=sessionsOn(k),refl=state.reflections[k];
  const gp=Math.round(Math.min(100,mins/dailyGoalMin()*100));
  const detail=`<div class="card">
    <div class="card-title"><h3>${fmtDateLong(k)}</h3><button type="button" class="btn btn-soft btn-sm" data-action="cal-add-task">${icon('plus','s')} Add task for this day</button></div>
    <div class="cal-detail-row"><span>Study time</span><b>${fmtMin(mins)}</b></div>
    <div class="cal-detail-row"><span>Daily goal</span><b>${gp}%</b></div>
    <div class="cal-detail-row"><span>Focus sessions</span><b>${sess.length}</b></div>
    <div class="cal-detail-row"><span>Tasks</span><b>${done.length} / ${ts.length} completed</b></div>
    ${refl?`<div class="cal-detail-row"><span>Reflection</span><b style="color:var(--gold)">${'★'.repeat(refl.rating||0)}${'☆'.repeat(5-(refl.rating||0))}</b></div>`:''}
    ${ts.length?`<div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">${ts.map(t=>`<div style="display:flex;gap:9px;align-items:center;font-size:13.5px;color:${t.completed?'var(--text3)':'var(--text)'};${t.completed?'text-decoration:line-through':''}"><span class="task-check ${t.completed?'on':''}" style="width:18px;height:18px;cursor:default">${t.completed?icon('check'):''}</span>${esc(t.title)}</div>`).join('')}</div>`:'<p class="empty-line" style="margin-top:10px">No tasks planned for this day.</p>'}
  </div>`;
  return pageHead('CALENDAR','Your Month at a Glance')+`
  <div class="cal-layout">
    <div class="card">
      <div class="cal-head">
        <div style="display:flex;gap:6px;align-items:center">
          <button type="button" class="btn-icon btn-ghost" data-action="cal-nav" data-dir="-1" aria-label="Previous month">${icon('chevL')}</button>
          <h3>${monthName}</h3>
          <button type="button" class="btn-icon btn-ghost" data-action="cal-nav" data-dir="1" aria-label="Next month">${icon('chevR')}</button>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" data-action="cal-today">Today</button>
      </div>
      <div class="cal-dow">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>${detail}</div>`;
}

  html+=`<div class="refl-grid">
    <div class="card"><div class="card-title"><h3>Today's Reflection</h3></div>
      <form id="reflectForm" novalidate>
        <div class="field"><label>What did I accomplish today?</label><textarea class="input" name="accomplished" placeholder="Even small wins count.">${esc(ex?ex.accomplished:'')}</textarea></div>

        <div style="display:flex;justify-content:flex-end;gap:10px">${ex?'<span class="chip">Saved ✓ — updating is allowed</span>':''}<button type="submit" class="btn btn-primary">Save Reflection</button></div>
      </form>
    </div>
    <div class="card"><div class="card-title"><h3>Tomorrow's Starting Point</h3></div>
      ${carry.length?carry.map(t=>`<div class="tomorrow-row">
        <div><div class="tr-t">${esc(t.title)}</div><div class="tl-meta">${esc(t.subject)} · ${t.date<tk?'overdue from '+fmtDateShort(t.date):'today'} · ${fmtMin(t.studiedMin)} studied</div></div>
        <div style="display:flex;gap:6px;align-items:center">
          <button type="button" class="btn btn-soft btn-sm" data-action="tomorrow-move" data-id="${t.id}">Move to tomorrow</button>
          <button type="button" class="btn btn-ghost btn-sm" data-action="tomorrow-keep" data-id="${t.id}">Keep</button>
          <button type="button" class="btn-icon btn-ghost" data-action="task-edit" data-id="${t.id}" aria-label="Edit">${icon('pencil')}</button>
          <button type="button" class="btn-icon btn-ghost danger" data-action="tomorrow-remove" data-id="${t.id}" aria-label="Remove">${icon('trash')}</button>

      ${r.improve?`<p><b>Improve:</b> ${esc(r.improve)}</p>`:''}

const POST={
  tasks:bindDrag,

  },
  reflections(){
    $('#reflectForm')?.addEventListener('submit',e=>{
      e.preventDefault();
      const d=Object.fromEntries(new FormData(e.target).entries());
      state.reflections[todayKey()]={accomplished:String(d.accomplished||''),improve:String(d.improve||''),rating:ratingSel,savedAt:Date.now()};
      save();toast('Reflection saved. See you tomorrow. 🌙');renderPage();

    });
    $$('input[name="theme"]',f).forEach(r=>r.addEventListener('change',()=>{U().theme=r.value;applyTheme();save();}));
    $$('input[name="comp"]',f).forEach(r=>r.addEventListener('change',()=>{U().compHidden=r.value==='hide';applyCompanionVisibility();save();}));

function renderPage(){
  const el=$('#page');

}
function updateChrome(){
  $$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===currentPage));

  $$('.theme-toggle-btn').forEach(b=>b.innerHTML=icon(U().theme==='dark'?'sun':'moon'));
