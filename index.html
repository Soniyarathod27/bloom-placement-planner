  rate(el){ratingSel=+el.dataset.v;const row=$('#star-row');if(row)row.innerHTML=[1,2,3,4,5].map(i=>`<button type="button" class="star ${i<=ratingSel?'on':''}" data-action="rate" data-v="${i}" aria-label="${i} stars">★</button>`).join('');},
  'tomorrow-move'(el){const t=findTask(el.dataset.id);if(!t)return;t.date=tomorrowKey();t.deferredAck=false;save();renderPage();toast('Moved to tomorrow.');},
  'tomorrow-keep'(el){const t=findTask(el.dataset.id);if(!t)return;t.deferredAck=true;save();renderPage();},
  'tomorrow-remove'(el){const t=findTask(el.dataset.id);if(!t)return;openConfirm('Remove task?',`“${t.title}” will be deleted.`,'Remove',()=>{state.tasks=state.tasks.filter(x=>x.id!==t.id);save();renderApp();toast('Task removed.');});},
  'subject-remove'(el){const s=el.dataset.s;U().subjects=U().subjects.filter(x=>x!==s);save();renderPage();toast('Subject removed.');},
  'export-data'(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bloom-study-data.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported.');},
  'reset-data'(){openConfirm('Reset everything?','All your tasks, goals, sessions, streaks and progress will be permanently deleted.','Reset everything',()=>{localStorage.removeItem(KEY);location.reload();});},
  'modal-close'(){closeModal();},
  'confirm-yes'(){const cb=confirmCb;confirmCb=null;closeModal();cb&&cb();},
  'comp-hug'(){compHug();},
  'comp-talk'(){compStartTalk();},
  'comp-motivate'(){compMotivate();},
  'comp-sleep'(){compGoSleep();},
  'comp-reply'(el){compTalkReply(+el.dataset.i);},
  'comp-bye'(){compEndTalk();},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const fn=ACTIONS[el.dataset.action];
  if(fn){e.preventDefault();fn(el,e);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeSheet();}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('.pill')){navTo('focus');}
});
function closeSheet(){$('#sheet').classList.remove('open');}

/* ================= onboarding ================= */
const OB_SUBJECTS=['DSA','Java','Python','DBMS','Operating Systems','Computer Networks','OOP','Aptitude','Coding Practice','Projects','Resume','Interview Preparation'];
const OB_TARGETS=['Software Developer','Full Stack Developer','Java Developer','Data Analyst','Cybersecurity','Other'];
let ob=null;
function startOnboarding(){
  ob={step:0,name:'',target:'',targetCustom:'',days:90,hours:4,subjects:new Set(),session:50,custom:''};
  $('#onboard').classList.remove('hidden');
  renderOb();
  $('#onboard').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();obNext();}});
}
function renderOb(){
  const steps=[
    ()=>`<h1 class="ob-title serif">Build Your Placement Journey.</h1>
      <p class="ob-sub">A little progress every day can become a very different future.</p>
      <p class="ob-tag">Plan today · Focus deeply · Build your future</p>
      <div class="field"><label>What's your name?</label><input class="input" id="ob-name" placeholder="Your name" value="${esc(ob.name)}" autofocus></div>`,
    ()=>`<span class="eyebrow">STEP 2 · YOUR GOAL</span><h1 class="ob-title serif" style="font-size:clamp(22px,3.6vw,30px)">What's your target?</h1>
      <div class="ob-chips" style="margin-bottom:14px">${OB_TARGETS.map(t=>`<button type="button" class="ob-chip ${ob.target===t?'on':''}" data-action="ob-target" data-t="${t}">${t}</button>`).join('')}</div>
      ${ob.target==='Other'?`<div class="field"><label>Tell us your target</label><input class="input" id="ob-target-custom" placeholder="e.g. Data Engineer" value="${esc(ob.targetCustom)}"></div>`:''}`,
    ()=>`<span class="eyebrow">STEP 3 · TIMELINE</span><h1 class="ob-title serif" style="font-size:clamp(22px,3.6vw,30px)">How long, and how deep?</h1>
      <div class="frow">
        <div class="field"><label>How many days do you want to prepare?</label><input class="input" type="number" id="ob-days" min="7" max="1095" value="${ob.days}"></div>
        <div class="field"><label>Hours per day?</label><input class="input" type="number" id="ob-hours" min="0.5" max="16" step="0.5" value="${ob.hours}"></div>
      </div>
      <p class="empty-line">You can adjust both anytime in Settings.</p>`,
    ()=>`<span class="eyebrow">STEP 4 · SUBJECTS</span><h1 class="ob-title serif" style="font-size:clamp(22px,3.6vw,30px)">Pick your main subjects</h1>
      <p class="ob-sub" style="margin-bottom:14px">Choose everything you'll prepare — add or remove later.</p>
      <div class="ob-chips">${OB_SUBJECTS.map(s=>`<button type="button" class="ob-chip ${ob.subjects.has(s)?'on':''}" data-action="ob-subject" data-s="${s}">${s}</button>`).join('')}</div>`,
    ()=>`<span class="eyebrow">STEP 5 · RHYTHM</span><h1 class="ob-title serif" style="font-size:clamp(22px,3.6vw,30px)">Daily preferred study sessions</h1>
      <div class="ob-chips" style="margin-bottom:14px">${[25,50,90].map(m=>`<button type="button" class="ob-chip ${ob.session===m&&!ob.custom?'on':''}" data-action="ob-session" data-m="${m}">${m} minutes</button>`).join('')}</div>
      <div class="field"><label>Custom (1–180 minutes)</label><input class="input" type="number" id="ob-session-custom" min="1" max="180" placeholder="e.g. 40" value="${esc(ob.custom)}"></div>`,
    ()=>`<div style="text-align:center">
        <div style="font-size:44px;margin-bottom:6px">🌸</div>
        <h1 class="ob-title serif">Your placement journey is ready.</h1>
        <div class="ob-recap" style="text-align:left">
          <div><span>Name</span><b>${esc(ob.name)}</b></div>
          <div><span>Target</span><b>${esc(ob.target==='Other'?(ob.targetCustom.trim()||'Placement'):ob.target)}</b></div>
          <div><span>Duration</span><b>${ob.days} days</b></div>
          <div><span>Daily goal</span><b>${ob.hours} hours</b></div>
          <div><span>Subjects</span><b>${ob.subjects.size} selected</b></div>
          <div><span>Sessions</span><b>${ob.custom?ob.custom:ob.session} min</b></div>
        </div>
        <p class="empty-line" style="margin-top:10px">Mochi is waiting to follow you around ♡</p>
      </div>`,
  ];
  const last=ob.step===5;
  $('#onboard').innerHTML=`<div class="ob-deco a"></div><div class="ob-deco b"></div>
  <div class="ob-card"><div class="ob-step">${steps[ob.step]()}</div>
  <p class="ob-err" id="ob-err"></p>
  <div class="ob-btns">
    ${ob.step>0?`<button type="button" class="btn btn-ghost" data-action="ob-back">Back</button>`:'<span></span>'}
    <button type="button" class="btn btn-primary btn-lg" data-action="${last?'ob-start':'ob-next'}">${last?'Start My Journey →':'Continue'}</button>
  </div>
  <div class="ob-dots">${steps.map((_,i)=>`<span class="ob-dot ${i===ob.step?'on':''}"></span>`).join('')}</div>
  </div>`;
  const setFocus=()=>{const f=$('#ob-name')||$('#ob-target-custom')||$('#ob-days')||$('#ob-session-custom');if(f)f.focus();};
  setTimeout(setFocus,60);
}
function obErr(m){const e=$('#ob-err');if(e)e.textContent=m||'';}
function obNext(){
  obErr('');
  if(ob.step===0){const v=($('#ob-name')?.value||'').trim();if(!v)return obErr('Please tell me your name.');ob.name=v;}
  if(ob.step===1){
    if(!ob.target)return obErr('Pick a target role — or choose Other.');
    if(ob.target==='Other'){const v=($('#ob-target-custom')?.value||'').trim();if(!v)return obErr('Write your custom target.');ob.targetCustom=v;}
  }
  if(ob.step===2){
    const d=+($('#ob-days')?.value||0),h=+($('#ob-hours')?.value||0);
    if(!(d>=7&&d<=1095))return obErr('Duration should be between 7 and 1095 days.');
    if(!(h>=0.5&&h<=16))return obErr('Daily hours should be between 0.5 and 16.');
    ob.days=Math.round(d);ob.hours=h;
  }
  if(ob.step===3){if(!ob.subjects.size)return obErr('Pick at least one subject.');}
  if(ob.step===4){
    const c=($('#ob-session-custom')?.value||'').trim();
    if(c){const v=+c;if(!(v>=1&&v<=180))return obErr('Custom session must be 1–180 minutes.');ob.custom=c;}
  }
  ob.step++;renderOb();
}
function finishOnboarding(){
  const target=ob.target==='Other'?(ob.targetCustom.trim()||'Placement'):ob.target;
  state=defaultState();
  state.user={name:ob.name.trim(),target,durationDays:clamp(ob.days,7,1095),dailyHours:clamp(ob.hours,0.5,16),sessionMin:clamp(ob.custom?+ob.custom:ob.session,1,180),breakMin:5,subjects:[...ob.subjects],theme:'light',quotes:'daily',compHidden:false,createdAt:new Date().toISOString()};
  const base=[['Programming Fundamentals',['Coding Practice']],['DSA',['DSA']],['Core CS',['DBMS','Operating Systems','Computer Networks','OOP']],['Aptitude',['Aptitude']],['Projects',['Projects']],['Resume',['Resume']],['Mock Interviews',['Interview Preparation']],['Coding Assessments',['Coding Practice','DSA']],['PLACEMENT READY',[]]];
  state.journey.stages=base.map(([name,subs])=>({id:uid(),name,subjects:subs.filter(s=>state.user.subjects.includes(s)),status:'not-started',targetDate:''}));
  save();
  $('#onboard').classList.add('hidden');
  $('#app').classList.remove('hidden');
  applyTheme();renderApp();initCute();
  toast(`Welcome, ${state.user.name.split(' ')[0]}. One focused session at a time.`);
}
Object.assign(ACTIONS,{
  'ob-next'(){obNext();},
  'ob-back'(){if(ob.step>0){ob.step--;renderOb();}},
  'ob-start'(){finishOnboarding();},
  'ob-target'(el){ob.target=el.dataset.t;renderOb();},
  'ob-subject'(el){const s=el.dataset.s;ob.subjects.has(s)?ob.subjects.delete(s):ob.subjects.add(s);el.classList.toggle('on');obErr('');},
  'ob-session'(el){ob.session=+el.dataset.m;ob.custom='';renderOb();},
});

/* ================= shell & init ================= */
function applyTheme(){document.documentElement.dataset.theme=U().theme;}
const NAV=[['dashboard','home','Dashboard'],['tasks','tasks','Tasks'],['focus','timer','Focus'],['goals','target','Goals'],['stats','chart','Statistics'],['achievements','trophy','Achievements'],['calendar','calendar','Calendar'],['reflections','reflect','Reflections'],['settings','settings','Settings']];
const NAV_MAIN=[['dashboard','home','Home'],['tasks','tasks','Tasks'],['focus','timer','Focus'],['goals','target','Goals'],['stats','chart','Stats']];
function initShell(){
  $('#logo-ic').innerHTML=icon('heart');$('#logo-ic2').innerHTML=icon('heart');
  $('#more-btn').innerHTML=icon('dots');
  $('#side-nav').innerHTML=NAV.map(([p,i,l])=>`<button type="button" class="nav-item" data-action="nav" data-nav="${p}">${icon(i)}${l}</button>`).join('');
  $('#bottom-nav').innerHTML=NAV_MAIN.map(([p,i,l])=>`<button type="button" class="bn-item" data-action="nav" data-nav="${p}">${icon(i)}${l}</button>`).join('');
  $('#sheet-grid').innerHTML=NAV.map(([p,i,l])=>`<button type="button" class="nav-item" data-action="nav" data-nav="${p}">${icon(i)}${l}</button>`).join('');
}
function init(){
  initShell();
  state=loadState();
  if(state&&state.user){
    applyTheme();
    $('#app').classList.remove('hidden');
    renderApp();
    initCute();
    if(U().compHidden)setTimeout(()=>toast('🐰 Mochi is hidden — enable her in Settings → Study companion'),1500);
  }else{
    startOnboarding();
  }
}
init();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
